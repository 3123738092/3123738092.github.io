    Research Experience:
      - company: Enhancement of the TimeSeriesScientist (TSci) Agentic Framework
        position: "Supervisor: Prof. Hao Liu, AI Thrust, HKUST(GZ)"
        start_date: 2026-01
        end_date: Present
        highlights:
          - Integrated advanced data augmentation and In-Context Learning capabilities into the agent to enhance the handling of missing data and irregular time series.
          - Redesigned the Planner agent by incorporating Chain-of-Thought (CoT) reasoning to significantly improve the interpretability and transparency of the model selection process.
          - Enhanced the Reporter agent to synthesize complex statistical diagnostics and ensemble results into intuitive, human-readable narratives.

      - company: Building a Hybrid Event Sensor Simulator
        position: "Supervisor: Prof. Hui Xiong, AI Thrust, HKUST(GZ)"
        start_date: 2025-06
        end_date: 2025-12
        highlights:
          - Systematically collected scene datasets under zero-lux, strong light exposure, and high-contrast scenes to analyze the noise behavior.
          - Implemented components of the EVS noise model, including event-probability estimation using the Q-function and intensity-to-voltage domain mapping.
          - Evaluated simulator realism by fine-tuning state-of-the-art video interpolation and deblurring models (e.g., TimeLens, EFNet) on synthetic data.

      - company: High-Speed Motion Analysis in Badminton via Event Camera
        position: "Supervisor: Prof. Hui Xiong, AI Thrust, HKUST(GZ)"
        start_date: 2025-06
        end_date: 2025-09
        highlights:
          - Adapted state-of-the-art models by integrating their structural merits into a custom-designed framework.
          - Modified gradient backpropagation functions in the training pipeline and migrated core numerical computation modules to enable end-to-end gradient differentiability.
          - Refined dataset construction and DataLoader architectures to enhance compatibility with diverse input modalities.

    Project Experience:
      - name: Multi-Skill Pipeline for Daily Paper Briefings
        summary: "Supervisor: Prof. Enyan Dai, AI Thrust, HKUST(GZ)"
        start_date: 2026-02
        end_date: 2026-05
        highlights:
          - Designed an "Orchestrator + Skills" architecture in which skills communicate only through versioned JSON files under shared_data, keeping modules fully decoupled.
          - Implemented the unified orchestrator arxiv_agent.py with serial pipeline execution, idempotent re-runs, and fast-fail short-circuit when the data-collector returns zero papers.
          - Built the data-collector skill — arXiv paper fetching, metadata extraction, 384-dim MiniLM embedding generation, and construction of the cosine-similarity paper graph and co-author graph consumed by the downstream ranker.

      - name: Explanations of LLM — AttnLRP on GPT-2
        summary: "Supervisor: Prof. Sihong Xie, AI Thrust, HKUST(GZ)"
        start_date: 2025-03
        end_date: 2025-06
        highlights:
          - Set up the lxt AttnLRP framework via an efficient monkey-patch implementation on GPT-2, establishing the code pipeline shared by the whole project.
          - Designed three visualization tools which surfaced GPT-2's negative-logit sign-flip artifact in AttnLRP, and co-developed the contrastive-gradient masking fix that restored correct relevance signs.

      - name: Brain-to-Image Retrieval & Reconstruction on THINGS-EEG2
        summary: "Supervisor: Prof. Chen Liang, AI Thrust, HKUST(GZ)"
        start_date: 2026-02
        end_date: 2026-05
        highlights:
          - Designed the Hierarchical Visual Features (HVF) pipeline, fusing CLIP RN50, CLIP ViT-B/32, and the Stable Diffusion VAE into a single regression target for the downstream EEG encoder.
          - Replaced plain-sum fusion with a sigmoid-gated fusion (bias init +3.0), letting the model learn to attenuate unhelpful encoders — materially improved Top-5 / Top-10 / Mean Rank.
          - Added a fourth encoder (DINOv2 ViT-S/14 fine-tuned on Depth Anything V2) to inject a 3D/depth prior missing from purely semantic features.

      - name: Social Navigation with 3D Simulator
        summary: "Supervisor: Prof. Junwei Liang, AI Thrust, HKUST(GZ)"
        start_date: 2025-08
        end_date: 2025-12
        highlights:
          - Developed and optimized social navigation policies for embodied agents in Habitat Lab, with a solid understanding of embodied perception and robot-environment interaction in complex simulated scenes.
          - Tuned PPO training pipelines and robot-related configuration parameters, including navigation, sensing, and action settings, to improve policy and task performance.
          - Enhanced agent performance significantly by incorporating custom penalty mechanisms in the metrics modules, including orientation-alignment and path-overlap penalties.

    Competition and Awards:
      - title: Ascend AI Innovation Contest Season 8 (Atlas 910B) — Outstanding Prize
        date: 2026-06
        awarder: Huawei
        summary: >
          National competition organized by Huawei. Implemented the Scale and Atanh operators as custom AI Core kernels in Ascend C,
          using msopgen-generated op_host (Tiling + InferShape + prototype registration) and op_kernel projects targeting the
          Atlas 910B (aarch64) platform. Designed generalized tiling strategies covering arbitrary-rank inputs (1D / 2D / 4D / 6D)
          with non-32-aligned tail handling, and used dispatch to specialize kernels per dtype (fp16 / bf16 / fp32) and shape regime.

      - title: Deblurring for HVS/HybridEVS Camera @ MIPI Challenge — Rank 6 / 130
        date: 2025-07
        awarder: MIPI Challenge
        summary: >
          International competition; ranked 6th over 130 participants worldwide. Revised gradient backpropagation components within
          the training framework — migrated core numerical computation modules from NumPy to PyTorch, establishing end-to-end
          gradient differentiability. Applied novel deblurring-specific models (EFNet, ESL) to enhance restoration performance
          for blurred visual content.

      - title: 2024 Mecha Master University Alliance Competition (Southwest Region) — Top 8
        date: 2024-02
        awarder: Mecha Master
        summary: >
          National university-level competition; placed top 8 in the infantry confrontation. Self-taught SolidWorks to independently
          design and model mechanical parts and assembly structures; fabricated custom parts using 3D printers and lathes; collaborated
          closely with the electrical-control team on wiring and electrical integration to ensure seamless system functionality.

