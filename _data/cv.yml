        summary: >
          National competition organized by Huawei. Implemented Scale and Atanh operators as custom AI Core kernels in Ascend C
          using msopgen-generated op_host (Tiling + InferShape + prototype registration) and op_kernel projects on the Atlas 910B (aarch64).
          Designed generalized tiling covering 1D/2D/4D/6D inputs with non-32-aligned tail handling, and used dispatch to specialize
          kernels per dtype (fp16 / bf16 / fp32) and shape regime.

      - title: MIPI Challenge — Deblurring for HVS/HybridEVS Camera (Rank 6 / 130)
