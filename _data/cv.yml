    Research Experience:
      - bullet: |
          <h6 class="title font-weight-bold">Enhancement of the TimeSeriesScientist (TSci) Agentic Framework <span style="float: right; font-size: 0.8rem; font-weight: 400">Jan. 2026 – Present</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">Supervisor: Prof. Hao Liu, AI Thrust, HKUST(GZ)</h6>
          <ul class="items">
            <li><span class="item">Integrated advanced data augmentation and In-Context Learning capabilities into the agent to enhance the handling of missing data and irregular time series.</span></li>
            <li><span class="item">Redesigned the Planner agent by incorporating Chain-of-Thought (CoT) reasoning to significantly improve the interpretability and transparency of the model selection process.</span></li>
            <li><span class="item">Enhanced the Reporter agent to synthesize complex statistical diagnostics and ensemble results into intuitive, human-readable narratives.</span></li>
          </ul>

      - bullet: |
          <h6 class="title font-weight-bold">Building a Hybrid Event Sensor Simulator <span style="float: right; font-size: 0.8rem; font-weight: 400">June 2025 – Dec. 2025</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">Supervisor: Prof. Hui Xiong, AI Thrust, HKUST(GZ)</h6>
          <ul class="items">
            <li><span class="item">Systematically collected scene datasets under zero-lux, strong light exposure, and high-contrast scenes to analyze the noise behavior.</span></li>
            <li><span class="item">Implemented components of the EVS noise model, including event-probability estimation using the Q-function and intensity-to-voltage domain mapping.</span></li>
            <li><span class="item">Evaluated simulator realism by fine-tuning state-of-the-art video interpolation and deblurring models (e.g., TimeLens, EFNet) on synthetic data.</span></li>
          </ul>

      - bullet: |
          <h6 class="title font-weight-bold">High-Speed Motion Analysis in Badminton via Event Camera <span style="float: right; font-size: 0.8rem; font-weight: 400">June 2025 – Sep. 2025</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">Supervisor: Prof. Hui Xiong, AI Thrust, HKUST(GZ)</h6>
          <ul class="items">
            <li><span class="item">Adapted state-of-the-art models by integrating their structural merits into a custom-designed framework.</span></li>
            <li><span class="item">Modified gradient backpropagation functions in the training pipeline and migrated core numerical computation modules to enable end-to-end gradient differentiability.</span></li>
            <li><span class="item">Refined dataset construction and DataLoader architectures to enhance compatibility with diverse input modalities.</span></li>
          </ul>

    Project Experience:
      - bullet: |
          <h6 class="title font-weight-bold">Multi-Skill Pipeline for Daily Paper Briefings <span style="float: right; font-size: 0.8rem; font-weight: 400">Feb. 2026 – May 2026</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">Supervisor: Prof. Enyan Dai, AI Thrust, HKUST(GZ)</h6>
          <ul class="items">
            <li><span class="item">Designed an "Orchestrator + Skills" architecture in which skills communicate only through versioned JSON files under shared_data, keeping modules fully decoupled.</span></li>
            <li><span class="item">Implemented the unified orchestrator arxiv_agent.py with serial pipeline execution, idempotent re-runs, and fast-fail short-circuit when the data-collector returns zero papers.</span></li>
            <li><span class="item">Built the data-collector skill — arXiv paper fetching, metadata extraction, 384-dim MiniLM embedding generation, and construction of the cosine-similarity paper graph and co-author graph consumed by the downstream ranker.</span></li>
          </ul>

      - bullet: |
          <h6 class="title font-weight-bold">Explanations of LLM — AttnLRP on GPT-2 <span style="float: right; font-size: 0.8rem; font-weight: 400">Mar. 2025 – June 2025</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">Supervisor: Prof. Sihong Xie, AI Thrust, HKUST(GZ)</h6>
          <ul class="items">
            <li><span class="item">Set up the lxt AttnLRP framework via an efficient monkey-patch implementation on GPT-2, establishing the code pipeline shared by the whole project.</span></li>
            <li><span class="item">Designed three visualization tools which surfaced GPT-2's negative-logit sign-flip artifact in AttnLRP, and co-developed the contrastive-gradient masking fix that restored correct relevance signs.</span></li>
          </ul>

      - bullet: |
          <h6 class="title font-weight-bold">Brain-to-Image Retrieval & Reconstruction on THINGS-EEG2 <span style="float: right; font-size: 0.8rem; font-weight: 400">Feb. 2026 – May 2026</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">Supervisor: Prof. Chen Liang, AI Thrust, HKUST(GZ)</h6>
          <ul class="items">
            <li><span class="item">Designed the Hierarchical Visual Features (HVF) pipeline, fusing CLIP RN50, CLIP ViT-B/32, and the Stable Diffusion VAE into a single regression target for the downstream EEG encoder.</span></li>
            <li><span class="item">Replaced plain-sum fusion with a sigmoid-gated fusion (bias init +3.0), letting the model learn to attenuate unhelpful encoders — materially improved Top-5 / Top-10 / Mean Rank.</span></li>
            <li><span class="item">Added a fourth encoder (DINOv2 ViT-S/14 fine-tuned on Depth Anything V2) to inject a 3D/depth prior missing from purely semantic features.</span></li>
          </ul>

      - bullet: |
          <h6 class="title font-weight-bold">Social Navigation with 3D Simulator <span style="float: right; font-size: 0.8rem; font-weight: 400">Aug. 2025 – Dec. 2025</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">Supervisor: Prof. Junwei Liang, AI Thrust, HKUST(GZ)</h6>
          <ul class="items">
            <li><span class="item">Developed and optimized social navigation policies for embodied agents in Habitat Lab, with a solid understanding of embodied perception and robot-environment interaction in complex simulated scenes.</span></li>
            <li><span class="item">Tuned PPO training pipelines and robot-related configuration parameters, including navigation, sensing, and action settings, to improve policy and task performance.</span></li>
            <li><span class="item">Enhanced agent performance significantly by incorporating custom penalty mechanisms in the metrics modules, including orientation-alignment and path-overlap penalties.</span></li>
          </ul>

    Competition and Awards:
      - bullet: |
          <h6 class="title font-weight-bold">Ascend AI Innovation Contest Season 8 (Atlas 910B) <span style="float: right; font-size: 0.8rem; font-weight: 400">June 2026</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">National competition organized by Huawei; awarded Outstanding Prize.</h6>
          <ul class="items">
            <li><span class="item">Implemented the Scale and Atanh operators as custom AI Core kernels in Ascend C, using msopgen-generated op_host (Tiling + InferShape + prototype registration) and op_kernel projects targeting the Atlas 910B (aarch64) platform.</span></li>
            <li><span class="item">Designed generalized tiling strategies covering arbitrary-rank inputs (1D / 2D / 4D / 6D) with non-32-aligned tail handling, and used dispatch technology to specialize kernels per dtype (fp16 / bf16 / fp32) and shape regime.</span></li>
          </ul>

      - bullet: |
          <h6 class="title font-weight-bold">Deblurring for HVS/HybridEVS Camera @ MIPI Challenge <span style="float: right; font-size: 0.8rem; font-weight: 400">July 2025</span></h6>
          <h6 style="font-size: 0.95rem; font-style: italic">International competition; Rank 6 over 130 participants worldwide.</h6>
          <ul class="items">
            <li><span class="item">Revised the gradient backpropagation components within the training framework — migrated core numerical computation modules from NumPy to PyTorch, establishing end-to-end gradient differentiability.</span></li>
            <li><span class="item">Applied novel deblurring-specific models (EFNet, ESL) to tackle image deblurring tasks, leveraging their specialized architectures to enhance restoration performance for blurred visual content.</span></li>
          </ul>

