        summary: >
          International competition. Revised gradient backpropagation, migrated core numerical modules from NumPy to PyTorch for
          end-to-end differentiability. Applied deblurring-specific models (EFNet, ESL) to enhance restoration quality.

      - title: 2024 Mecha Master University Alliance Competition (Southwest Region) — Top 8
