        summary: Enhancing the TSci agentic framework for time-series forecasting.
        highlights:
          - Integrated advanced data augmentation and In-Context Learning into the agent to better handle missing data and irregular time series.
          - Redesigned the Planner agent with Chain-of-Thought reasoning to improve interpretability of model selection.
          - Enhanced the Reporter agent to turn complex statistical diagnostics and ensembles into human-readable narratives.

      - company: HKUST(GZ) — Prof. Hui Xiong
        position: Research Assistant (Hybrid Event Sensor Simulator)
        location: Guangzhou, China
        start_date: 2025-06
        end_date: 2025-12
        summary: Built a physically-grounded event-camera noise simulator.
        highlights:
          - Systematically collected scene datasets under zero-lux, strong exposure, and high-contrast scenes to analyze noise behavior.
          - Implemented EVS noise-model components including Q-function event-probability estimation and intensity-to-voltage domain mapping.
          - Evaluated simulator realism by fine-tuning TimeLens and EFNet on synthetic data.

      - company: HKUST(GZ) — Prof. Hui Xiong
        position: Research Assistant (Badminton Motion Analysis via Event Camera)
        location: Guangzhou, China
        start_date: 2025-06
        end_date: 2025-09
        summary: High-speed motion analysis in badminton using event cameras.
        highlights:
          - Adapted SOTA models by integrating their structural merits into a custom framework.
          - Modified gradient backpropagation and migrated core numerical modules to enable end-to-end differentiability.
          - Refined dataset construction and DataLoader architectures for diverse input modalities.

    Projects:
      - name: Multi-Skill Pipeline for Daily Paper Briefings
        summary: "Advisor: Prof. Enyan Dai, HKUST(GZ). Orchestrator + Skills architecture for daily arXiv briefings."
        highlights:
          - Designed an Orchestrator + Skills architecture; skills communicate only through versioned JSON files under shared_data, keeping modules fully decoupled.
          - Implemented arxiv_agent.py with serial pipeline execution, idempotent re-runs, and fast-fail short-circuit when the data-collector returns zero papers.
          - Built the data-collector skill — arXiv fetching, metadata extraction, 384-dim MiniLM embeddings, and construction of cosine-similarity paper and co-author graphs used by the downstream ranker.
        start_date: 2026-02
        end_date: 2026-05

      - name: Explanations of LLM — AttnLRP on GPT-2
        summary: "Advisor: Prof. Sihong Xie, HKUST(GZ). Attribution-based interpretability for GPT-2."
        highlights:
          - Set up the lxt AttnLRP framework via an efficient monkey-patch on GPT-2, establishing the shared code pipeline for the project.
          - Designed three visualization tools that surfaced GPT-2's negative-logit sign-flip artifact in AttnLRP.
          - Co-developed the contrastive-gradient masking fix that restored correct relevance signs.
        start_date: 2025-03
        end_date: 2025-06

      - name: Brain-to-Image Retrieval & Reconstruction on THINGS-EEG2
        summary: "Advisor: Prof. Chen Liang, HKUST(GZ). EEG-based visual decoding with hierarchical features."
        highlights:
          - Designed the Hierarchical Visual Features (HVF) pipeline fusing CLIP RN50, CLIP ViT-B/32, and the Stable Diffusion VAE into a single regression target for the EEG encoder.
          - Replaced plain-sum fusion with a sigmoid-gated fusion (bias init +3.0) — materially improved Top-5 / Top-10 / Mean Rank.
          - Added a fourth encoder (DINOv2 ViT-S/14 fine-tuned on Depth Anything V2) to inject a 3D/depth prior missing from purely semantic features.
        start_date: 2026-02
        end_date: 2026-05

      - name: Social Navigation with 3D Simulator (Habitat)
        summary: "Advisor: Prof. Junwei Liang, HKUST(GZ). Embodied social navigation policies in Habitat Lab."
        highlights:
          - Developed and optimized social navigation policies for embodied agents in Habitat Lab.
          - Tuned PPO training and robot configuration (navigation, sensing, action) for improved policy performance.
          - Added custom penalty mechanisms (orientation alignment, path-overlap) in the metrics modules to significantly improve agent behavior.
        start_date: 2025-08
        end_date: 2025-12

    Awards:
      - title: Ascend AI Innovation Contest Season 8 (Atlas 910B) — Outstanding Prize
